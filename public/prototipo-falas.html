<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Protótipo: como a Fala sai do Personagem</title>
  <!-- Página descartável (issue #14). Usa o visual da Mesa sem mexer nele. Apagar depois da escolha. -->
  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/table.css">
  <style>
    body { display: flex; }
    #app { flex: 1; min-width: 0; }

    /* ---------- a vez: anel amarelo que pulsa, sem crescer ---------- */
    .seat.vez { z-index: 3; }
    .seat.vez .face-photo { animation: vez-anel 1s ease-in-out infinite alternate; }
    @keyframes vez-anel {
      from { box-shadow: 0 0 0 6px #ffd400, 0 0 18px 4px #ffd40066, 0 6px 14px #000a; }
      to   { box-shadow: 0 0 0 11px #ffd400, 0 0 40px 16px #ffd40099, 0 6px 14px #000a; }
    }
    .seat.vez .nameplate { outline: 3px solid #ffd400; }

    /* ---------- a Fala: o Personagem cresce (A, B e C) ---------- */
    .avatar { transition: transform .45s cubic-bezier(.16, 1, .3, 1); }
    .seat.falando { z-index: 6; }
    .seat.falando .avatar { transform: scale(1.35); }

    /* ---------- A: balão grande saindo do Personagem ---------- */
    .fala-balao {
      position: absolute; z-index: 30; white-space: nowrap; pointer-events: none;
      font: 900 clamp(34px, 6.2vh, 72px) / 1 "Arial Black", Impact, sans-serif; color: #1a0e05;
      background: #fffbea; padding: .28em .5em .32em; border-radius: .45em;
      border: 5px solid #1a0e05; box-shadow: 8px 8px 0 #000a;
      animation: balao-entra .35s cubic-bezier(.16, 1, .3, 1);
    }
    /* o rabinho aponta para quem fala */
    .fala-balao::after {
      content: ""; position: absolute; width: 26px; height: 26px; background: #fffbea;
      border: 5px solid #1a0e05; border-top: 0; border-left: 0;
    }
    .pos-bottom .fala-balao { bottom: 96%; left: 50%; translate: -50% 0; transform-origin: center bottom; }
    .pos-bottom .fala-balao::after { left: calc(50% - 13px); bottom: -16px; rotate: 45deg; }
    .pos-top .fala-balao { top: 96%; left: 50%; translate: -50% 0; transform-origin: center top; }
    .pos-top .fala-balao::after { left: calc(50% - 13px); top: -16px; rotate: 225deg; }
    .pos-left .fala-balao { left: 92%; top: 18%; transform-origin: left center; }
    .pos-left .fala-balao::after { left: -16px; top: calc(50% - 13px); rotate: 135deg; }
    .pos-right .fala-balao { right: 92%; top: 18%; transform-origin: right center; }
    .pos-right .fala-balao::after { right: -16px; top: calc(50% - 13px); rotate: -45deg; }
    @keyframes balao-entra { from { transform: scale(.3); opacity: 0; } }

    /* ---------- B: a palavra voa do Personagem até o meio ---------- */
    .fala-voa {
      position: fixed; left: 0; top: 0; z-index: 65; pointer-events: none; text-align: center;
      white-space: nowrap; will-change: transform, opacity;
    }
    .fala-voa .palavra {
      display: block; font: 900 min(15vw, 180px) / .95 "Arial Black", Impact, sans-serif; color: #ffd400;
      -webkit-text-stroke: 5px #000; text-shadow: 8px 8px 0 var(--time), 14px 14px 0 #000;
    }
    .fala-voa .quem {
      display: inline-flex; align-items: center; gap: .4em; margin-top: .3em; padding: .15em .7em .15em .2em;
      font: 900 clamp(20px, 3.4vh, 38px) "Arial Black", sans-serif; color: #fff;
      background: var(--time); border-radius: 2em; box-shadow: 0 4px 0 #0008;
    }
    .fala-voa .quem img { width: 1.6em; height: 1.6em; border-radius: 50%; object-fit: cover; border: 3px solid #fff; }

    /* ---------- C: legenda embaixo do Personagem ---------- */
    .fala-legenda {
      position: absolute; z-index: 30; left: 50%; bottom: 2%; translate: -50% 0; white-space: nowrap; pointer-events: none;
      font: 900 clamp(26px, 4.6vh, 52px) / 1 "Arial Black", Impact, sans-serif; color: #ffd400;
      background: #120800ee; padding: .18em .45em .22em; border-radius: .3em;
      border: 4px solid var(--time); box-shadow: 0 6px 0 #000a;
      animation: legenda-entra .3s cubic-bezier(.16, 1, .3, 1);
    }
    @keyframes legenda-entra { from { transform: translateY(40%); opacity: 0; } }

    .t0 { --time: #2f7bff; }
    .t1 { --time: #ff3b3b; }

    /* ---------- painel de teste (fora da Mesa) ---------- */
    #painel {
      width: 330px; flex: none; height: 100vh; overflow-y: auto; padding: 14px 14px 20px;
      background: #140a03; border-left: 3px solid #ffd400; display: flex; flex-direction: column; gap: 14px;
      font-size: 14px;
    }
    #painel.fechado { display: none; }
    #painel h1 { font: 900 18px "Arial Black", sans-serif; margin: 0; color: #ffd400; }
    #painel h2 { font: 800 12px "Avenir Next", sans-serif; letter-spacing: .12em; text-transform: uppercase; margin: 0 0 6px; color: #f3e3c8aa; }
    #painel p { margin: 0; color: #f3e3c8cc; line-height: 1.35; }
    .versoes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .versoes button {
      background: #2a1608; color: #f3e3c8; border: 2px solid #5a3a1a; border-radius: 10px; padding: 8px 4px;
      font: 900 22px "Arial Black", sans-serif;
    }
    .versoes button[aria-pressed="true"] { background: #ffd400; color: #1a0e05; border-color: #ffd400; }
    #versao-desc { min-height: 2.7em; }
    .lugar { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 8px; border-radius: 12px; background: #2a1608; }
    .lugar .titulo { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; font-weight: 800; }
    .lugar .titulo img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; border: 3px solid var(--time); }
    .lugar .titulo small { font-weight: 600; opacity: .6; }
    .lugar button, .acoes button {
      background: #43250f; color: #fff; border: 1px solid #ffffff22; border-radius: 8px; padding: 7px 4px; font-weight: 700;
    }
    .lugar button:hover, .acoes button:hover { background: #5a3416; }
    .lugar button.btn-vez { grid-column: span 1; }
    .lugar button.btn-vez[aria-pressed="true"] { background: #ffd400; color: #1a0e05; }
    .acoes { display: grid; gap: 6px; }
    .acoes button { padding: 10px; font-size: 15px; }
    kbd { font: 700 12px ui-monospace, monospace; background: #2a1608; border: 1px solid #ffffff33; border-radius: 4px; padding: 0 5px; }
  </style>
</head>
<body data-v="A">
  <div id="app">
    <header id="scorebar">
      <div class="team t0">
        <div class="tname shout">DUPLA AZUL</div>
        <div class="members">Tonhão e Nina</div>
        <div class="bar"><div class="bar-fill" style="width: 33%"></div></div>
      </div>
      <div class="pts shout t0c">4</div>
      <div id="hud">
        <div id="value-badge" class="shout">VALE 1</div>
        <div id="rounds"><div class="rdot r0"></div><div class="rdot"></div><div class="rdot"></div></div>
      </div>
      <div class="pts shout t1c">7</div>
      <div class="team t1">
        <div class="tname shout">DUPLA VERMELHA</div>
        <div class="members">Cida e Roque</div>
        <div class="bar"><div class="bar-fill" style="width: 58%"></div></div>
      </div>
    </header>

    <main id="room">
      <div class="seat pos-top" id="seat2"></div>
      <div class="seat pos-left" id="seat1"></div>
      <div id="felt">
        <div id="center">
          <div class="slot slot2" id="slot2"></div>
          <div class="slot slot1" id="slot1"></div>
          <div id="mid">
            <div id="vira-tag" class="shout">VIRA</div>
            <div id="vira"><div class="card back"><div class="back-art">🃏</div></div></div>
          </div>
          <div class="slot slot3" id="slot3"></div>
          <div class="slot slot0" id="slot0"></div>
        </div>
      </div>
      <div class="seat pos-right" id="seat3"></div>
      <div class="seat pos-bottom" id="seat0"></div>
    </main>
  </div>

  <aside id="painel">
    <div>
      <h1>Como a Fala sai do Personagem</h1>
      <p>Protótipo da issue #14. Não é o jogo. <kbd>H</kbd> esconde este painel.</p>
    </div>
    <div>
      <h2>Versão <kbd>A</kbd> <kbd>B</kbd> <kbd>C</kbd></h2>
      <div class="versoes" id="versoes">
        <button data-v="A" aria-pressed="true">A</button>
        <button data-v="B" aria-pressed="false">B</button>
        <button data-v="C" aria-pressed="false">C</button>
      </div>
      <p id="versao-desc"></p>
    </div>
    <div class="acoes">
      <button id="btn-cena">▶ Tocar uma cena (Truco, Seis, Aceito…)</button>
      <button id="btn-aviso">Aviso da Mesa: MÃO DE ONZE!</button>
    </div>
    <p>"Sua vez!" é a Fala do Personagem. "◎ Vez" só acende o anel amarelo de quem joga.</p>
    <div id="lugares"></div>
  </aside>

  <div id="overlay"></div>

  <script>
    (function () {
      const LUGARES = [
        { pos: 'bottom', nome: 'Tonhão', foto: 'tonhao', onde: 'embaixo' },
        { pos: 'left', nome: 'Cida', foto: 'cida', onde: 'esquerda' },
        { pos: 'top', nome: 'Nina', foto: 'nina', onde: 'em cima' },
        { pos: 'right', nome: 'Roque', foto: 'roque', onde: 'direita' },
      ];
      // A Fala e a cara que o Personagem faz enquanto fala.
      const FALAS = {
        truco: { txt: 'TRUCO!', cara: 'falando' },
        seis: { txt: 'SEIS!', cara: 'falando' },
        aceito: { txt: 'ACEITO!', cara: 'feliz' },
        corro: { txt: 'CORRO! 🐔', cara: 'triste' },
        suavez: { txt: 'SUA VEZ!', cara: 'falando' },
      };
      const CARAS = ['neutro', 'falando', 'feliz', 'triste'];
      const DESC = {
        A: 'O Personagem cresce e um balão grande sai dele, com o rabinho apontando para quem fala.',
        B: 'O Personagem cresce e a palavra sai voando dele até o meio da tela, com o nome de quem falou.',
        C: 'O Personagem cresce e a palavra aparece embaixo do rosto, como legenda. Sem balão.',
      };
      // ?fica=1 deixa a Fala parada na tela (para tirar foto).
      const FICA = new URLSearchParams(location.search).has('fica');
      const DURA = 2400;
      const EASE = 'cubic-bezier(.16, 1, .3, 1)';
      const $ = (id) => document.getElementById(id);
      const seat = (i) => $('seat' + i);
      let versao = 'A';
      let vez = -1;
      const timers = [];

      // ---------- monta os 4 Lugares, com o mesmo HTML da Mesa ----------
      LUGARES.forEach((L, i) => {
        const fotos = CARAS.map((c) => `<img data-x="${c}" class="${c === 'neutro' ? 'on' : ''}" src="/avatars/${L.foto}/${c}.jpg" alt="">`).join('');
        const costas = '<div class="card back"><div class="back-art">🃏</div></div>'.repeat(3);
        const el = seat(i);
        el.className = `seat pos-${L.pos} t${i % 2}`;
        el.innerHTML = `<div class="avatar"><div class="face-photo">${fotos}</div></div>`
          + `<div class="seat-info"><div class="nameplate">${L.nome}</div><div class="backs">${costas}</div></div>`;

        const row = document.createElement('div');
        row.className = `lugar t${i % 2}`;
        row.innerHTML = `<div class="titulo"><img src="/avatars/${L.foto}/neutro.jpg" alt="">${L.nome} <small>${L.onde}</small></div>`
          + Object.keys(FALAS).map((k) => `<button data-fala="${k}">${FALAS[k].txt.replace(' 🐔', '')}</button>`).join('')
          + '<button class="btn-vez" aria-pressed="false">◎ Vez</button>';
        row.addEventListener('click', (e) => {
          const b = e.target.closest('button');
          if (!b) return;
          if (b.dataset.fala) falar(i, b.dataset.fala);
          else marcarVez(vez === i ? -1 : i);
        });
        $('lugares').appendChild(row);
      });

      function cara(i, nome) {
        seat(i).querySelectorAll('.face-photo img').forEach((img) => img.classList.toggle('on', img.dataset.x === nome));
      }

      function limpar(i) {
        clearTimeout(timers[i]);
        const el = seat(i);
        el.classList.remove('falando');
        el.querySelectorAll('.fala-balao, .fala-legenda').forEach((n) => n.remove());
        document.querySelectorAll(`.fala-voa[data-seat="${i}"]`).forEach((n) => n.remove());
        cara(i, 'neutro');
      }

      // ---------- a Fala ----------
      function falar(i, k) {
        const f = FALAS[k];
        limpar(i);
        const el = seat(i);
        const av = el.querySelector('.avatar');
        el.classList.add('falando');
        cara(i, f.cara);
        if (versao === 'A') {
          const b = document.createElement('div');
          b.className = 'fala-balao';
          b.textContent = f.txt;
          av.appendChild(b);
        } else if (versao === 'C') {
          const c = document.createElement('div');
          c.className = 'fala-legenda';
          c.textContent = f.txt;
          av.appendChild(c);
        } else {
          voar(i, f.txt);
        }
        if (!FICA) timers[i] = setTimeout(() => limpar(i), DURA);
      }

      // B: a palavra nasce pequena em cima do rosto e voa até o meio da tela.
      function voar(i, txt) {
        const L = LUGARES[i];
        const w = document.createElement('div');
        w.className = `fala-voa t${i % 2}`;
        w.dataset.seat = i;
        w.innerHTML = `<span class="palavra"></span><span class="quem"><img src="/avatars/${L.foto}/falando.jpg" alt="">${L.nome}</span>`;
        w.querySelector('.palavra').textContent = txt;
        document.body.appendChild(w);
        const r = seat(i).querySelector('.face-photo').getBoundingClientRect();
        const app = $('app').getBoundingClientRect();
        const ww = w.offsetWidth, wh = w.offsetHeight;
        const de = `translate(${r.left + r.width / 2 - ww / 2}px, ${r.top + r.height / 2 - wh / 2}px) scale(.18)`;
        const ate = `translate(${app.left + app.width / 2 - ww / 2}px, ${app.top + app.height / 2 - wh / 2}px) scale(1)`;
        w.animate([
          { transform: de, opacity: 0 },
          { transform: de, opacity: 1, offset: .08 },
          { transform: ate, opacity: 1, offset: .3 },
          { transform: ate, opacity: 1, offset: .86 },
          { transform: ate, opacity: FICA ? 1 : 0 },
        ], { duration: DURA - 100, easing: EASE, fill: 'forwards' });
      }

      // ---------- a vez: só um Lugar por vez ----------
      function marcarVez(i) {
        vez = i;
        LUGARES.forEach((_, j) => {
          seat(j).classList.toggle('vez', j === i);
          document.querySelectorAll('.btn-vez')[j].setAttribute('aria-pressed', String(j === i));
        });
      }

      // ---------- Aviso da Mesa: no meio, sem ser de ninguém (igual ao jogo) ----------
      let avisoTimer;
      function aviso(txt) {
        const o = $('overlay');
        o.innerHTML = `<div class="ov-bg"></div><div class="ov-box"><div class="big-word small">${txt}</div></div>`;
        o.classList.add('show');
        clearTimeout(avisoTimer);
        avisoTimer = setTimeout(() => o.classList.remove('show'), 2200);
      }

      // ---------- versão ----------
      function escolher(v) {
        versao = v;
        document.body.dataset.v = v;
        document.querySelectorAll('#versoes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
        $('versao-desc').textContent = DESC[v];
        LUGARES.forEach((_, i) => limpar(i));
        clearTimeout(avisoTimer);
        $('overlay').classList.remove('show');
      }

      // Uma cena curta, para ver Fala e vez juntas sem clicar em tudo.
      let cena = [];
      function tocarCena() {
        cena.forEach(clearTimeout);
        const passos = [
          [0, () => marcarVez(0)],
          [600, () => falar(0, 'truco')],
          [700, () => marcarVez(1)],
          [3100, () => falar(1, 'seis')],
          [3200, () => marcarVez(2)],
          [5600, () => falar(2, 'aceito')],
          [8200, () => aviso('MÃO DE ONZE!')],
          [10600, () => marcarVez(3)],
          [11400, () => falar(3, 'suavez')],
          [13900, () => falar(3, 'corro')],
        ];
        cena = passos.map(([t, fn]) => setTimeout(fn, t));
      }

      $('versoes').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) escolher(b.dataset.v); });
      $('btn-aviso').addEventListener('click', () => aviso('MÃO DE ONZE!'));
      $('btn-cena').addEventListener('click', tocarCena);
      document.addEventListener('keydown', (e) => {
        const k = e.key.toUpperCase();
        if ('ABC'.includes(k) && k.length === 1) escolher(k);
        if (k === 'H') $('painel').classList.toggle('fechado');
      });

      // ?v=B abre direto numa versão
      const pedida = new URLSearchParams(location.search).get('v');
      escolher(pedida && DESC[pedida.toUpperCase()] ? pedida.toUpperCase() : 'A');
    })();
  </script>
</body>
</html>
