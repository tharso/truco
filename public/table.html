<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Truco do Bar do Zé — Mesa</title>
  <link rel="stylesheet" href="/common.css">
  <link rel="stylesheet" href="/table.css">
  <!-- Google Analytics (só no site publicado, não em localhost nem no Wi-Fi de casa) -->
  <script>
    (function (h) {
      if (h === 'localhost' || h.endsWith('.localhost') || /^[\d.]+$/.test(h) || h.includes(':')) return;
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-KV6LD0W0KF';
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', 'G-KV6LD0W0KF');
    })(location.hostname);
  </script>
</head>
<body>
  <div id="app">
    <header id="scorebar">
      <div class="team t0">
        <div class="tname shout">DUPLA AZUL</div>
        <div class="members" id="m0"></div>
        <div class="beans" id="b0"></div>
      </div>
      <div class="pts shout t0c" id="s0">0</div>
      <div id="title" class="shout">TRUCO<small>do Bar do Zé</small></div>
      <div class="pts shout t1c" id="s1">0</div>
      <div class="team t1">
        <div class="tname shout">DUPLA VERMELHA</div>
        <div class="members" id="m1"></div>
        <div class="beans" id="b1"></div>
      </div>
    </header>

    <main id="felt">
      <div class="seat pos-bottom" id="seat0"></div>
      <div class="seat pos-left" id="seat1"></div>
      <div class="seat pos-top" id="seat2"></div>
      <div class="seat pos-right" id="seat3"></div>
      <div id="center">
        <div class="slot slot0" id="slot0"></div>
        <div class="slot slot1" id="slot1"></div>
        <div class="slot slot2" id="slot2"></div>
        <div class="slot slot3" id="slot3"></div>
      </div>
      <div id="mid">
          <div id="vira-box">
            <div id="deck"><div class="card back" style="--cw:62px"><div class="back-art">🃏</div></div></div>
            <div id="vira"></div>
          </div>
          <div id="man-label"></div>
          <div id="rounds"></div>
          <div id="value-badge" class="shout"></div>
        </div>
      <div id="status" class="shout"></div>
    </main>

    <aside id="banca">
      <div class="ze-wrap">
        <div id="ze-bubble" class="bubble"></div>
        <div id="ze" class="char"></div>
        <div class="balcao shout">SEU ZÉ · A BANCA</div>
      </div>
      <div id="log"></div>
      <div id="controls">
        <button id="btn-voice" title="Liga/desliga a voz">🔊 Voz</button>
        <button id="btn-mic" title="Liga o Gritômetro">🎤 Gritômetro</button>
        <button id="btn-lobby" title="Voltar ao início">🏠 Início</button>
      </div>
    </aside>
  </div>

  <div id="lobby" class="screen hidden">
    <div class="lobby-box">
      <h1 class="shout">TRUCO <span>do Bar do Zé</span></h1>
      <div class="lobby-grid">
        <div class="lobby-ze" id="lobby-ze"></div>
        <div class="lobby-steps">
          <div class="step">
            <b>1.</b> Ligue o som e o microfone (pro Gritômetro).
            <button id="btn-unlock" class="big-btn yellow">🔊🎤 Ligar som e microfone</button>
            <span id="unlock-status"></span>
          </div>
          <div class="step">
            <b>2.</b> <span id="url-hint">No celular, no mesmo Wi-Fi, abra:</span>
            <div id="lan-url" class="url shout">…</div>
          </div>
          <div class="step seats-step">
            <b>3.</b> Cada um escolhe seu lugar no celular:
            <div class="lobby-seats">
              <div class="lseat t0" id="lseat0"></div>
              <div class="lseat t1" id="lseat1"></div>
            </div>
          </div>
          <button id="btn-start" class="big-btn red shout">COMEÇAR!</button>
          <div id="start-msg"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="endscreen" class="screen hidden">
    <div class="end-box">
      <div class="trophy">🏆</div>
      <h1 id="end-title" class="shout"></h1>
      <div id="end-score" class="shout"></div>
      <div class="end-btns">
        <button id="btn-again" class="big-btn red shout">JOGAR DE NOVO</button>
        <button id="btn-end-lobby" class="big-btn">Trocar jogadores</button>
      </div>
    </div>
  </div>

  <div id="overlay"></div>
  <div id="fx-layer"></div>

  <script src="/shared.js"></script>
  <script src="/lines.js"></script>
  <script src="/faces.js"></script>
  <script src="/fx.js"></script>
  <script src="/table.js"></script>
</body>
</html>
