<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Teste de estilos — Tonhão</title>
<style>
body{font-family:"Avenir Next",system-ui,sans-serif;background:#2a1608;color:#fff;margin:0;padding:24px}
h1{margin:0 0 4px;color:#ffd400}p{margin:0 0 20px;opacity:.8}
.row{display:grid;grid-template-columns:160px repeat(3,1fr);gap:16px;align-items:center;margin-bottom:22px}
.row h2{font-size:22px;margin:0}.row h2 small{display:block;font-size:13px;opacity:.7;font-weight:500}
figure{margin:0;text-align:center}figure img{width:100%;max-width:300px;border-radius:50%;border:8px solid #2f7bff;box-shadow:0 8px 20px #000a}

</style>
<h1>Tonhão em 2 estilos</h1><p>Mesma pessoa, 3 caras: neutro, sinal do zap (piscadinha) e susto. No jogo, cada rosto fica num porta-retrato redondo.</p>
<div class="row"><h2>A<small>Caricatura pintada</small></h2>
<figure><img src="a-neutro.jpg"><figcaption>Neutro</figcaption></figure>
<figure><img src="a-zap.jpg"><figcaption>Zap (piscadinha)</figcaption></figure>
<figure><img src="a-susto.jpg"><figcaption>Susto</figcaption></figure></div>
<div class="row"><h2>B<small>Animação 3D</small></h2>
<figure><img src="b-neutro.jpg"><figcaption>Neutro</figcaption></figure>
<figure><img src="b-zap.jpg"><figcaption>Zap (piscadinha)</figcaption></figure>
<figure><img src="b-susto.jpg"><figcaption>Susto</figcaption></figure></div>
